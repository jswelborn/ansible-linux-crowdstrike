---
- name: Check and remediate CrowdStrike Falcon service
  hosts: all
  become: true
  gather_facts: false

  vars:
    service_name: falcon-sensor.service

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
      register: crowdstrike_service_facts
      ignore_unreachable: true

    - name: End compliance check for unreachable host
      ansible.builtin.meta: end_host
      when: crowdstrike_service_facts is ansible.builtin.unreachable

    - name: Fail if CrowdStrike Falcon service is missing
      ansible.builtin.fail:
        msg: "CrowdStrike Falcon service is missing"
      when: service_name not in ansible_facts.services

    - name: Start and enable CrowdStrike Falcon service when it is stopped
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: started
        enabled: true
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"

    - name: Refresh service facts after remediation
      ansible.builtin.service_facts:
      register: crowdstrike_remediation_facts
      ignore_unreachable: true

    - name: End compliance check if host became unreachable
      ansible.builtin.meta: end_host
      when: crowdstrike_remediation_facts is ansible.builtin.unreachable

    - name: Fail if CrowdStrike Falcon service is still not running
      ansible.builtin.fail:
        msg: "CrowdStrike Falcon service exists but could not be started"
      when:
        - service_name in ansible_facts.services
        - ansible_facts.services[service_name].state != "running"