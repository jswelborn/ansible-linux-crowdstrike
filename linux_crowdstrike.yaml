---
- name: Install CrowdStrike on Linux
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/crowdstrike.yaml

  vars:
    crowdstrike_package_names:
      - falcon-sensor
      - CrowdStrike Device Control
      - CrowdStrike Firmware Analysis
      - CrowdStrike Sensor Platform

    crowdstrike_service_name: falcon-sensor.service

  pre_tasks:
    - name: Validate CrowdStrike CID is provided
      ansible.builtin.assert:
        that:
          - crowdstrike_cid is defined
          - crowdstrike_cid | length > 0
        fail_msg: >-
          crowdstrike_cid must be provided by the AAP credential unless
          crowdstrike_local_mode is true.
      when: not crowdstrike_local_mode | bool
      no_log: true

  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check whether CrowdStrike is already installed
      ansible.builtin.set_fact:
        crowdstrike_installed: >-
          {{
            'falcon-sensor' in ansible_facts.packages or
            'CrowdStrike Device Control' in ansible_facts.packages or
            'CrowdStrike Firmware Analysis' in ansible_facts.packages or
            'CrowdStrike Sensor Platform' in ansible_facts.packages
          }}

    - name: Install CrowdStrike when it is not already installed
      when: not crowdstrike_installed | bool
      block:
        - name: Determine package suffix
          ansible.builtin.set_fact:
            os_package_suffix: >-
              {%- if ansible_distribution == 'Ubuntu' -%}
              _{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb
              {%- elif ansible_distribution == 'Amazon' -%}
              .amzn{{ ansible_distribution_major_version }}.{{ ansible_architecture }}.rpm
              {%- elif ansible_os_family == 'RedHat' -%}
              .el{{ ansible_distribution_major_version }}.{{ ansible_architecture }}.rpm
              {%- else -%}
              unsupported
              {%- endif -%}

        - name: Fail if unsupported platform
          ansible.builtin.fail:
            msg: >-
              Unsupported platform:
              {{ ansible_distribution }} / {{ ansible_os_family }}
          when: os_package_suffix == "unsupported"

        - name: Build package filename
          ansible.builtin.set_fact:
            os_package_filename: >-
              falcon-sensor{{ '_' if ansible_distribution == 'Ubuntu' else '-' }}{{ crowdstrike_version }}{{ os_package_suffix }}

        - name: Set local package path
          ansible.builtin.set_fact:
            os_package_local_path: >-
              {{ crowdstrike_linux_install_path }}/{{ os_package_filename }}

        - name: Download CrowdStrike package
          ansible.builtin.get_url:
            url: "{{ crowdstrike_package_url }}{{ os_package_filename }}"
            dest: "{{ os_package_local_path }}"
            mode: "0644"

        - name: Install CrowdStrike dependency on Ubuntu
          ansible.builtin.apt:
            name: libnl-genl-3-200
            state: present
            update_cache: true
          when: ansible_distribution == "Ubuntu"

        - name: Install CrowdStrike on Ubuntu
          ansible.builtin.apt:
            deb: "{{ os_package_local_path }}"
            state: present
          when: ansible_distribution == "Ubuntu"
          notify:
            - Link CrowdStrike agent
            - Start CrowdStrike service

        - name: Install CrowdStrike on RHEL or Amazon Linux
          ansible.builtin.dnf:
            name: "{{ os_package_local_path }}"
            state: present
            disable_gpg_check: true
          when: ansible_distribution != "Ubuntu"
          notify:
            - Link CrowdStrike agent
            - Start CrowdStrike service

    - name: Apply pending CrowdStrike installation handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure CrowdStrike service is enabled and started
      ansible.builtin.systemd_service:
        name: "{{ crowdstrike_service_name }}"
        enabled: true
        state: started
      when: not crowdstrike_local_mode | bool

    - name: Wait for CrowdStrike service to stabilize
      ansible.builtin.pause:
        seconds: 5
      when: not crowdstrike_local_mode | bool

    - name: Verify CrowdStrike service is active
      ansible.builtin.command:
        cmd: systemctl is-active "{{ crowdstrike_service_name }}"
      register: crowdstrike_service_status
      changed_when: false
      failed_when: crowdstrike_service_status.stdout | trim != "active"
      when: not crowdstrike_local_mode | bool

    - name: Show CrowdStrike service status
      ansible.builtin.debug:
        msg: >-
          {{ crowdstrike_service_name }} is
          {{ crowdstrike_service_status.stdout | trim }}
      when: not crowdstrike_local_mode | bool

    # Bootstrap audit

    - name: Refresh installed package facts for audit
      ansible.builtin.package_facts:
        manager: auto

    - name: Refresh service facts for audit
      ansible.builtin.service_facts:

    - name: Determine installed CrowdStrike package name
      ansible.builtin.set_fact:
        crowdstrike_detected_package_name: >-
          {%- if 'falcon-sensor' in ansible_facts.packages -%}
          falcon-sensor
          {%- elif 'CrowdStrike Device Control' in ansible_facts.packages -%}
          CrowdStrike Device Control
          {%- elif 'CrowdStrike Firmware Analysis' in ansible_facts.packages -%}
          CrowdStrike Firmware Analysis
          {%- elif 'CrowdStrike Sensor Platform' in ansible_facts.packages -%}
          CrowdStrike Sensor Platform
          {%- else -%}
          not installed
          {%- endif -%}

    - name: Ensure bootstrap asset audit directory exists
      ansible.builtin.file:
        path: /etc/hts/bootstrap/assets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Build CrowdStrike bootstrap audit data
      ansible.builtin.set_fact:
        crowdstrike_bootstrap_audit:
          asset: crowdstrike
          status: successful
          package: "{{ crowdstrike_detected_package_name }}"
          version: >-
            {{
              (
                ansible_facts.packages[crowdstrike_detected_package_name]
                | first
              ).version
              if crowdstrike_detected_package_name in ansible_facts.packages
              else 'not installed'
            }}
          service: "{{ crowdstrike_service_name }}"
          service_state: >-
            {{
              ansible_facts.services[crowdstrike_service_name].state
              if crowdstrike_service_name in ansible_facts.services
              else 'not found'
            }}
          service_status: >-
            {{
              crowdstrike_service_status.stdout | trim
              if (
                crowdstrike_service_status is defined and
                crowdstrike_service_status.stdout is defined
              )
              else (
                ansible_facts.services[crowdstrike_service_name].state
                if crowdstrike_service_name in ansible_facts.services
                else 'not found'
              )
            }}
          local_mode: "{{ crowdstrike_local_mode | bool }}"
          job_template: >-
            {{
              awx_job_template_name
              | default(
                  tower_job_template_name
                  | default('unknown')
                )
            }}
          job_id: >-
            {{
              awx_job_id
              | default(
                  tower_job_id
                  | default('unknown')
                )
            }}
          workflow_job_id: >-
            {{
              awx_workflow_job_id
              | default(
                  tower_workflow_job_id
                  | default('unknown')
                )
            }}
          project_revision: >-
            {{
              awx_project_revision
              | default(
                  tower_project_revision
                  | default('unknown')
                )
            }}
          inventory_hostname: "{{ inventory_hostname }}"
          completed: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Record CrowdStrike bootstrap asset
      ansible.builtin.copy:
        dest: /etc/hts/bootstrap/assets/crowdstrike.json
        content: >-
          {{
            crowdstrike_bootstrap_audit
            | ansible.builtin.to_nice_json
          }}

        owner: root
        group: root
        mode: "0644"

    - name: Validate CrowdStrike bootstrap audit JSON
      ansible.builtin.command:
        cmd: python3 -m json.tool /etc/hts/bootstrap/assets/crowdstrike.json
      changed_when: false

  handlers:
    - name: Link CrowdStrike agent
      ansible.builtin.command:
        cmd: "/opt/CrowdStrike/falconctl -fs --cid={{ crowdstrike_cid }}"
      when:
        - not crowdstrike_local_mode | bool
        - crowdstrike_cid is defined
        - crowdstrike_cid | length > 0
      no_log: true
      changed_when: true

    - name: Start CrowdStrike service
      ansible.builtin.systemd_service:
        name: "{{ crowdstrike_service_name }}"
        enabled: true
        state: started
      when: not crowdstrike_local_mode | bool